    <style>

        .workout-day {

        .workout-day.active {

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }

        .toast.show {

        }
        
        .reset-btn {

        }
        
        .reset-btn:hover {

            color: var(--text-dark);
        }
    </style>
</head>
<body>

    <header>
        <h1>Gimnasio Lydia</h1>
        <p>Registro de Entrenamientos</p>
    </header>

    <div class="container">
        <div class="day-selector" id="day-selector">
            <!-- Day buttons injected here -->
        </div>

        <div id="workouts-container">
            <!-- Workout forms injected here -->
        </div>
        
        <button class="reset-btn" onclick="limpiarDatos()">Empezar nueva semana (Borrar datos)</button>
    </div>

    <div class="toast" id="toast">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        Guardado automáticamente
    </div>

    <script>
        const rutinas = [
            {
                id: "day1",
                title: "DÍA 1",
                subtitle: "GLUTES & HAMSTRINGS",
                exercises: [
                    { name: "Hack Squat (Sentadilla Hack)", img: "img/hack-squat.png" },
                    { name: "Leg Curl (Curl Isquios)", img: "img/leg-curl.png" },
                    { name: "Hip Thrust", img: "img/hip-thrust.png" },
                    { name: "RDL (Peso Muerto Rumano)", img: "img/rdl.png" },
                    { name: "Hack Squat (Sentadilla Hack)", img: "img/hack-squat.png" },
                    { name: "Hack Squat (Sentadilla Hack)", img: "img/hack-squat.png" },
                    { name: "Glute Extension (Extensión de Glúteo)", img: "img/glute-extension.png" }
                ]
            },
            {
                id: "day2",
                title: "DÍA 2",
                subtitle: "PUSH: CHEST, SHOULDERS, TRICEPS",
                exercises: [
                    { name: "Chest Press (Máquina / Mancuernas)", img: "img/chest-press.png" },
                    { name: "Overhead Press (Press Militar)", img: "img/overhead-press.png" },
                    { name: "Lateral Raises (Elevaciones Laterales)", img: "img/lateral-raises.png" },
                    { name: "Tricep Pushdown (Extensión Tríceps Polea)", img: "img/tricep-pushdown.png" },
                    { name: "Hack Squat (Sentadilla Hack)", img: "img/hack-squat.png" },
                    { name: "Hack Squat (Sentadilla Hack)", img: "img/hack-squat.png" },
                    { name: "Dips (Fondos)", img: "img/dips.png" }
                ]
            },
            {
                id: "day3",
                title: "DÍA 3",
                subtitle: "QUADS & GLUTES",
                exercises: [
                    { name: "Leg Press (Prensa)", img: "img/leg-press.png" },
                    { name: "Bulgarian Split Squat (Búlgara)", img: "img/bulgarian-squat.png" },
                    { name: "Leg Extension (Extensión Cuádriceps)", img: "img/leg-extension.png" },
                    { name: "Hack Squat (Sentadilla Hack)", img: "img/hack-squat.png" },
                    { name: "Hack Squat (Sentadilla Hack)", img: "img/hack-squat.png" },
                    { name: "Hack Squat (Sentadilla Hack)", img: "img/hack-squat.png" },
                    { name: "Hack Squat / Sentadilla Libre", img: "img/hack-squat.png" }
                ]
            },
            {
                id: "day4",
                title: "DÍA 4",
                subtitle: "PULL: BACK, BICEPS, ABS",
                exercises: [
                    { name: "Lat Pulldown (Jalón al Pecho)", img: "img/lat-pulldown.png" },
                    { name: "Seated Row (Remo Sentado)", img: "img/seated-row.png" },
                    { name: "Assisted Pull-ups (Dominadas Asistidas)", img: "img/assisted-pullups.png" },
                    { name: "Bicep Curl (Curl de Bíceps)", img: "img/bicep-curl.png" },
                    { name: "Hack Squat (Sentadilla Hack)", img: "img/hack-squat.png" },
                    { name: "Hack Squat (Sentadilla Hack)", img: "img/hack-squat.png" },
                    { name: "Ab Crunches (Abdominales)", img: "img/crunches.png" }
                ]
            }
        ];

        let saveTimeout;

        function initApp() {
            const selector = document.getElementById('day-selector');
            const container = document.getElementById('workouts-container');

            rutinas.forEach((rutina, index) => {
                const btn = document.createElement('button');
                btn.className = `day-btn ${index === 0 ? 'active' : ''}`;
                btn.textContent = rutina.title;
                btn.onclick = () => showDay(rutina.id, btn);
                selector.appendChild(btn);

                const dayDiv = document.createElement('div');
                dayDiv.className = `workout-day ${index === 0 ? 'active' : ''}`;
                dayDiv.id = rutina.id;
                
                const titleContainer = document.createElement('div');
                titleContainer.className = 'day-title-container';
                titleContainer.innerHTML = `
                    <div class="day-subtitle">${rutina.subtitle}</div>
                    <div class="day-title">${rutina.title}</div>
                `;
                dayDiv.appendChild(titleContainer);

                rutina.exercises.forEach((ejercicio, exIndex) => {
                    const exCard = document.createElement('div');
                    exCard.className = 'exercise-card';
                    
                    // Header del ejercicio con la imagen y el nombre
                    const headerDiv = document.createElement('div');
                    headerDiv.className = 'exercise-header';
                    
                    // Fallback visual si la imagen aún no está subida al repositorio
                    const fallbackImg = "https://placehold.co/120x120/F1F5F9/94A3B8?text=Img";
                    
                    headerDiv.innerHTML = `
                        <img src="${ejercicio.img}" class="exercise-img" alt="${ejercicio.name}" onerror="this.src='${fallbackImg}'">
                        <div class="exercise-name">${ejercicio.name}</div>
                    `;
                    exCard.appendChild(headerDiv);
                    
                    const seriesContainer = document.createElement('div');
                    seriesContainer.className = 'series-container';

                    for(let s = 1; s <= 3; s++) {
                        const serieKey = `${rutina.id}_ex${exIndex}_s${s}`;
                        const savedWeight = localStorage.getItem(`${serieKey}_w`) || '';
                        const savedReps = localStorage.getItem(`${serieKey}_r`) || '';

                        seriesContainer.innerHTML += `
                            <div class="serie-row">
                                <div class="serie-badge">${s}</div>
                                <div class="input-wrapper">
                                    <input type="number" step="0.5" placeholder="Peso" 
                                           id="${serieKey}_w" value="${savedWeight}"
                                           oninput="autoSave('${serieKey}_w')">
                                    <span class="input-unit">kg</span>
                                </div>
                                <div class="input-wrapper">
                                    <input type="number" placeholder="Reps" 
                                           id="${serieKey}_r" value="${savedReps}"
                                           oninput="autoSave('${serieKey}_r')">
                                    <span class="input-unit">reps</span>
                                </div>
                            </div>
                        `;
                    }
                    
                    exCard.appendChild(seriesContainer);
                    dayDiv.appendChild(exCard);
                });

                container.appendChild(dayDiv);
            });
        }

        function showDay(dayId, btnElement) {
            document.querySelectorAll('.workout-day').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.day-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(dayId).classList.add('active');
            btnElement.classList.add('active');
        }

        function autoSave(inputId) {
            const input = document.getElementById(inputId);
            localStorage.setItem(inputId, input.value);
            
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            }, 800);
        }
        
        function limpiarDatos() {
            if(confirm('¿Estás seguro de que quieres borrar todos los pesos y repeticiones de la rutina?')) {
                const inputs = document.querySelectorAll('input');
                inputs.forEach(input => {
                    input.value = '';
                    localStorage.removeItem(input.id);
                });
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
"""

with open('index.html', 'w', encoding='utf-8') as f:
    f.write(html_content)
    
print("File updated successfully.")
